name: unpack-reproducibility-package

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  unpack:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack synchronized source package
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f package_b64/READY ]; then
            echo "Transfer not complete; waiting for checksum-verified chunks."
            exit 0
          fi
          cat package_b64/part-00.txt package_b64/part-01.txt package_b64/rest-*.txt | base64 -d > reproducibility_package.zip
          unzip -t reproducibility_package.zip
          unzip -o reproducibility_package.zip -d .
          rm -rf package_b64
          rm -f .github/workflows/unpack.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish synchronized reproducibility source"
          git push
